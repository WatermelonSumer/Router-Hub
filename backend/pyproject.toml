[project]
name = "router-hub-backend"
version = "0.1.0"
description = "Router-Hub 后端：AI 中转站 Rank 系统（FastAPI + Tortoise ORM + Aerich）"
authors = [{ name = "Hero" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "tortoise-orm (>=0.23.0,<0.24.0)",
    "aerich (>=0.8.1,<0.9.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "uuid-utils (>=0.10.0,<0.11.0)",
    "cryptography (>=44.0.0,<45.0.0)",
    "bcrypt (>=4.1.0,<6.0.0)",
    "redis (>=5.2.0,<6.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.8.4"
pre-commit = "^4.0.0"

[tool.aerich]
tortoise_orm = "app.core.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F 基础，I 排序，UP 现代化，B bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
